# www-blocker configuration (TOML)
#
# After editing:  sudo systemctl reload www-blocker   (no restart needed)
# Check it with:  sudo ./www-blocker.py check

# true  = only log "WOULD BAN ..." - nothing is blocked
# false = add bans to the ipset (iptables drops their traffic)
dry_run = false

# Never banned, and a subnet ban is skipped if it overlaps any of these.
# Add your own public IP(s) here.
allowlist = [
    "127.0.0.0/8", "::1/128",
    "10.0.0.0/8",          # wg0 10.42.42.0/24, tun0 10.10.0.0/24
    "192.168.0.0/16",      # LAN
    "fc00::/7", "fe80::/10",
    "79.136.63.219/32",    # this server's own public address
]

[logs]
# Glob patterns; re-checked every rescan_interval seconds (and on file
# create/rename), so new vhost logs are picked up without a restart.
files = ["/var/log/httpd/*access*log"]
rescan_interval = 60
# Ban/expiry events are also written to <bans_log>-YYYYMMDD-HHMMSS.log in this
# directory - a new file each time the service starts. <bans_log>.log is a
# symlink to the current file. "" = journal only.
bans_log = "bans"

[detect]
# Ban a host that gets `threshold` responses with these statuses within
# `window` seconds. Every request path counts.
statuses = [400, 404]
threshold = 4
window = 20          # seconds
ban_minutes = 30

[subnet]
# When `min_hosts` different hosts from the same /24 (IPv6: /64) have been
# banned within `window` seconds, ban the whole subnet instead.
enabled = true
min_hosts = 3
window = 3600        # seconds
ban_minutes = 120
prefix_v4 = 24
prefix_v6 = 64

[firewall]
ports = [80, 443]            # only web traffic is dropped; mail etc. still works
set_name = "www-blocker"     # ipsets www-blocker4 / www-blocker6
chain = "WWW-BLOCKER"
ipv6 = true
log_drops = false            # true = rate-limited kernel log line per dropped packet
maxelem = 65536
